name: Unit Testing

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  unit_testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
      - name: Install dependencies
        run: flutter pub get
        
      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
